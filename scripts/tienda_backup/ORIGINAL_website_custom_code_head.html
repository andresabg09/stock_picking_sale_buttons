<script>
document.addEventListener("DOMContentLoaded", function() {
    // Definimos qué elementos queremos que se animen al hacer scroll
    const selectorsToAnimate = [
        '.sl-htitle', '.sl-hdesc', '.sl-stats-in > div', 
        '.sl-sec-hd', '.sl-flip', '.sl-bfeats', '.sl-bviz', 
        '.sl-tcard', '.oe_product_cart', '.o_wsale_products_main_row h1',
        '#product_detail .row > div'
    ];
    
    // Seleccionamos y preparamos todos los elementos
    let elementsToAnimate = [];
    selectorsToAnimate.forEach(selector => {
        const els = document.querySelectorAll(selector);
        els.forEach(el => {
            el.classList.add('animate-on-scroll');
            elementsToAnimate.push(el);
        });
    });
    
    // Animacion especial para la imagen principal (Hero)
    const heroImg = document.querySelector('.sl-hvis');
    if(heroImg) {
        heroImg.classList.add('anim-zoom');
        elementsToAnimate.push(heroImg);
    }

    // Usamos IntersectionObserver para detectar el scroll
    const observerOptions = {
        threshold: 0.1, // Se activa cuando un 10% del elemento es visible
        rootMargin: "0px 0px -50px 0px" // Margen inferior antes de activar
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                // Opcional: Descomentar linea abajo si queremos que la animación ocurra solo 1 vez
                // observer.unobserve(entry.target); 
            } else {
                // Removemos la clase para que se vuelva a animar cuando hagamos scroll hacia arriba y abajo
                entry.target.classList.remove('is-visible');
            }
        });
    }, observerOptions);

    // Observamos todos los elementos
    elementsToAnimate.forEach(el => observer.observe(el));
});
</script>
<!-- END SHALOM MEJORAS VISUALES -->



































<!-- AOS ANIMATIONS & COUNTERS -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    AOS.init({
        once: true,
        offset: 50,
        easing: 'ease-out-cubic',
        duration: 800
    });

    const statNums = document.querySelectorAll('.sl-snum');
    if(statNums.length > 0 && typeof IntersectionObserver !== 'undefined'){
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    let num = entry.target;
                    let target = parseInt(num.getAttribute('data-val') || "0");
                    if(target > 0) {
                        let count = 0;
                        const duration = 2000;
                        const increment = target / (duration / 16);
                        const updateCount = () => {
                            count += increment;
                            if(count < target) {
                                num.innerText = Math.ceil(count) + (num.getAttribute('data-suffix') || '');
                                requestAnimationFrame(updateCount);
                            } else {
                                num.innerText = target + (num.getAttribute('data-suffix') || '');
                            }
                        };
                        updateCount();
                    }
                    observer.unobserve(num);
                }
            });
        });
        statNums.forEach(num => observer.observe(num));
    }
});
</script>
<!-- END AOS ANIMATIONS -->
